<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ TCAS 70 Fast AI Chat & Calendar</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }
        
        /* โซนปฏิทินดึงจากคลังเดิม */
        .calendar-section { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .calendar-title { font-size: 1.4rem; font-weight: bold; color: #007bff; margin-bottom: 15px; text-align: center; }
        .news-list { display: flex; flex-direction: column; gap: 10px; }
        .news-item { background: #e7f1ff; padding: 12px; border-left: 5px solid #007bff; border-radius: 4px; display: flex; justify-content: space-between; }
        .news-date { font-weight: bold; color: #0056b3; }

        /* โซนห้องแชทสดเด้งไว */
        .chat-section { background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden; display: flex; flex-direction: column; }
        .chat-header { background: #28a745; color: white; padding: 15px; font-weight: bold; font-size: 1.2rem; }
        .key-box { padding: 10px 20px; background: #e2e3e5; display: flex; gap: 10px; align-items: center; font-size: 0.9rem; }
        .key-box input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        .chat-box { padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fafafa; height: 350px; overflow-y: auto; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 80%; line-height: 1.4; word-break: break-word; }
        .user-bubble { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-bubble { background: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; white-space: pre-line; }
        
        /* ช่องพิมพ์ข้อความด้านล่าง */
        .input-area { display: flex; border-top: 1px solid #eee; padding: 10px; background: white; gap: 10px; }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 1rem; }
        .input-area button { background: #28a745; color: white; border: none; padding: 0 22px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .input-area button:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">

    <div class="calendar-section">
        <div class="calendar-title">📌 กำหนดการและค่ายจากระบบอัตโนมัติ</div>
        <div class="news-list" id="calendarGrid">
            <p style="text-align:center; color:#888;">กำลังโหลดข้อมูลกำหนดการ...</p>
        </div>
    </div>

    <div class="chat-section">
        <div class="chat-header">💬 ห้องแชทสด ถาม-ตอบทันใจ (คุยตรงกับ AI)</div>
        
        <div class="key-box">
            <span>🔑 ใส่ Gemini API Key ของน้อตรงนี้ก่อนใช้งาน:</span>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." onchange="saveKey()">
        </div>

        <div class="chat-box" id="chatBox">
            <div class="msg bot-bubble">สวัสดีครับน้อลลล! อยากรู้อะไรถามพี่บอตได้ทันทีเลยน้า พิมพ์คุยในช่องด้านล่างได้เลยครับ! 👇</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="พิมพ์คำถามตรงนี้แล้วกดส่งได้เลย..." onkeypress="if(event.key==='Enter') sendToAI()">
            <button onclick="sendToAI()">ส่งข้อความ</button>
        </div>
    </div>

</div>

<script>
    const MY_GEMINI_KEY = "AQ.Ab8RN6LdHsesaiT-RLDc_iMf_qhO7wZhTiSne6wQZ34Ip3kmTA";
    window.onload = function() {
        if(localStorage.getItem('gemini_key')) {
            document.getElementById('apiKeyInput').value = MY_GEMINI_KEY;
        }
        loadCalendarData();
    }
    
    function saveKey() {
        localStorage.setItem('gemini_key', document.getElementById('apiKeyInput').value);
    }

    // ฟังก์ชันดึงข้อมูลกำหนดการใน data.json มาโชว์แบบเดิม
    async function loadCalendarData() {
        try {
            const response = await fetch('data.json?v=' + new Date().getTime());
            const data = await response.json();
            const calendarGrid = document.getElementById('calendarGrid');
            if (data.news && data.news.length > 0) {
                calendarGrid.innerHTML = '';
                data.news.forEach(item => {
                    calendarGrid.innerHTML += `
                        <div class="news-item">
                            <span>📌 ${item.title}</span>
                            <span class="news-date">📅 วันที่: ${item.date}</span>
                        </div>
                    `;
                });
            } else {
                calendarGrid.innerHTML = '<p style="text-align:center; color:#aaa;">⚠️ ยังไม่มีข้อมูลกำหนดการ</p>';
            }
        } catch (e) {
            document.getElementById('calendarGrid').innerHTML = '<p style="text-align:center; color:#aaa;">ไม่มีข้อมูลปฏิทินเก่าค้างอยู่</p>';
        }
    }

    // ฟังก์ชันส่งข้อความคุยสดกับ Gemini AI ทันทีไม่ผ่านบอตเก่า
    async function sendToAI() {
        const apiKey = document.getElementById('apiKeyInput').value.strip ? document.getElementById('apiKeyInput').value.trim() : document.getElementById('apiKeyInput').value;
        const userInput = document.getElementById('userInput').value;
        const chatBox = document.getElementById('chatBox');

        if (!apiKey) {
            alert('❌ น้อลลล อย่าลืมเอาคีย์ Gemini มาใส่ในช่องสีเทาก่อนน้า!');
            return;
        }
        if (!userInput.trim()) return;

        // 1. แปะคำถามของน้อลงหน้าจอฝั่งขวา
        chatBox.innerHTML += `<div class="msg user-bubble">${userInput}</div>`;
        document.getElementById('userInput').value = ''; // ล้างช่องพิมพ์
        chatBox.scrollTop = chatBox.scrollHeight; // เลื่อนหน้าจอลงล่างสุด

        // แปะข้อความกำลังพิมพ์รอคำตอบ
        const loadingId = 'loading-' + Date.now();
        chatBox.innerHTML += `<div class="msg bot-bubble" id="${loadingId}">กำลังพิมพ์ตอบคิดแป๊บน้าน้อลลล...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        // 2. ยิงตรงหาเซิร์ฟเวอร์ Google Gemini AI ทันที
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userInput + " (ให้ตอบในฐานะรุ่นพี่แนะนำเรื่องการเรียนและ TCAS อย่างเป็นกันเองและน่ารัก แทนตัวเองว่าพี่บอต และเรียกผู้ใช้ว่าน้อนะ)" }] }]
                })
            });
            
            const result = await response.json();
            const aiReply = result.candidates[0].content.parts[0].text;
            
            // 3. เอาคำตอบจริงมาแทนที่คำว่ากำลังพิมพ์
            document.getElementById(loadingId).innerText = aiReply;
        } catch (error) {
            console.error(error);
            document.getElementById(loadingId).innerText = "❌ เกิดข้อผิดพลาด! ลองเช็คดูว่า API Key ถูกต้องไหม หรืออินเทอร์เน็ตหลุดรึเปล่านะครับน้อ";
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
