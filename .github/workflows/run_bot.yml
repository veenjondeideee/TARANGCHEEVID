name: Run AI Scraper Bot

on:
  schedule:
    - cron: '0 17 * * *' # รันตอนเที่ยงคืนทุกวัน
  workflow_dispatch: # ปุ่มกดรันเองแมนนวล

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # 🌟 เพิ่มโค้ด 3 บรรทัดนี้เพื่อบังคับเปิดสิทธิ์เขียนไฟล์ให้บอตแบบร้อยเปอร์เซ็นต์
    permissions:
      contents: write
      
    steps:
    - name: คัดลอกโค้ด
      uses: actions/checkout@v4

    - name: ตั้งค่า Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: ติดตั้งเครื่องมือดึงเว็บ
      run: |
        pip install requests beautifulsoup4

    - name: รันสคริปต์บอต AI
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python scraper.py

    - name: บันทึกข้อมูลที่ AI จัดแล้วกลับเข้าคลัง
      run: |
        git config --global user.name "TCAS-AI-Bot"
        git config --global user.email "bot@github.com"
        git add data.json
        git commit -m "AI Auto-arranged Schedule" || exit 0
        git push
